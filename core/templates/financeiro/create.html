{% extends "base.html" %}

{% block content %}
<div class="container mt-4" style="max-width: 1100px;">

    <!-- TÍTULO -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0">➕ Novo Lançamento Financeiro</h4>
        <a href="{% url 'financeiro_dashboard' %}" class="btn btn-outline-secondary">
            ⬅️ Voltar
        </a>
    </div>

    <!-- CARD -->
    <form method="post" class="card shadow-sm border-0">
        {% csrf_token %}

        <div class="card-body">

            <!-- LINHA 1 -->
            <div class="row g-3 mb-3">

                <div class="col-md-3">
                    <label class="form-label fw-semibold">Tipo</label>
                    <select name="tipo" class="form-select" required>
                        <option value="entrada">💰 Entrada</option>
                        <option value="saida">💸 Saída</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-semibold">Categoria</label>
                    <select name="categoria" class="form-select" required>
                        <option value="mao_obra">🛠️ Mão de Obra</option>
                        <option value="peca">📦 Venda de Peça</option>
                        <option value="compra_peca">🧾 Compra de Peça</option>
                        <option value="nf_emitida">📄 NF Emitida</option>
                        <option value="nf_recebida">📥 NF Recebida</option>
                        <option value="geral">📌 Geral</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label class="form-label fw-semibold">Valor (R$)</label>
                    <input
                        type="number"
                        step="0.01"
                        name="valor"
                        class="form-control"
                        placeholder="0,00"
                        required
                    >
                </div>

                <div class="col-md-2">
                    <label class="form-label fw-semibold">Ordem de Serviço</label>
                    <select name="ordem_servico" class="form-select">
                        <option value="">---</option>
                        {% for os in ordens %}
                            <option value="{{ os.id }}">
                                OS #{{ os.id }} - {{ os.cliente }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

            </div>

            <!-- DESCRIÇÃO -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Descrição</label>
                <input
                    type="text"
                    name="descricao"
                    class="form-control"
                    placeholder="Ex: Compra de óleo, pagamento fornecedor, serviço..."
                    required
                >
            </div>

        </div>

        <!-- FOOTER -->
        <div class="card-footer bg-white d-flex justify-content-end gap-2">
            <a href="{% url 'financeiro_dashboard' %}" class="btn btn-outline-secondary">
                Cancelar
            </a>
            <button type="submit" class="btn btn-success px-4">
                💾 Salvar Lançamento
            </button>
        </div>

    </form>

</div>
{% endblock %}
